services:
  api:
    restart: unless-stopped
    build: ./app
    container_name: xcpro-api
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL}
      XCPRO_RUNTIME_ENV: ${XCPRO_RUNTIME_ENV:-prod}
      XCPRO_ALLOW_DEBUG_ENTITLEMENT_PACKAGE: ${XCPRO_ALLOW_DEBUG_ENTITLEMENT_PACKAGE:-false}
      XCPRO_GOOGLE_SERVER_CLIENT_IDS: ${XCPRO_GOOGLE_SERVER_CLIENT_IDS}
      XCPRO_GOOGLE_SERVER_CLIENT_ID: ${XCPRO_GOOGLE_SERVER_CLIENT_ID:-}
      XCPRO_PRIVATE_FOLLOW_BEARER_SECRET: ${XCPRO_PRIVATE_FOLLOW_BEARER_SECRET}
      XCPRO_PUSH_TOKEN_ENCRYPTION_SECRET: ${XCPRO_PUSH_TOKEN_ENCRYPTION_SECRET}
      XCPRO_GOOGLE_PLAY_PACKAGE_NAME: ${XCPRO_GOOGLE_PLAY_PACKAGE_NAME:-com.trust3.xcpro}
      XCPRO_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH: ${XCPRO_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH:-/run/secrets/google-play-service-account.json}
      XCPRO_GOOGLE_PLAY_RTDN_OIDC_AUDIENCE: ${XCPRO_GOOGLE_PLAY_RTDN_OIDC_AUDIENCE:-https://api.xcpro.com.au/api/v1/subscriptions/googleplay/rtdn}
      XCPRO_GOOGLE_PLAY_RTDN_EXPECTED_SERVICE_ACCOUNT_EMAIL: ${XCPRO_GOOGLE_PLAY_RTDN_EXPECTED_SERVICE_ACCOUNT_EMAIL:-xcpro-rtdn-push@xcpro-868cd.iam.gserviceaccount.com}
      XCPRO_ALLOW_TEST_RTDN_HEADER_AUTH: ${XCPRO_ALLOW_TEST_RTDN_HEADER_AUTH:-false}
      XCPRO_FCM_PROJECT_ID: ${XCPRO_FCM_PROJECT_ID:-}
      XCPRO_FCM_SERVICE_ACCOUNT_JSON_PATH: ${XCPRO_FCM_SERVICE_ACCOUNT_JSON_PATH:-/run/secrets/fcm-service-account.json}
      XCPRO_LIVE_READ_RATE_LIMIT_WINDOW_SECONDS: ${XCPRO_LIVE_READ_RATE_LIMIT_WINDOW_SECONDS:-60}
      XCPRO_LIVE_READ_RATE_LIMIT_GLOBAL: ${XCPRO_LIVE_READ_RATE_LIMIT_GLOBAL:-0}
      XCPRO_LIVE_READ_RATE_LIMIT_PER_USER: ${XCPRO_LIVE_READ_RATE_LIMIT_PER_USER:-0}
      XCPRO_LIVE_READ_RATE_LIMIT_PER_IP: ${XCPRO_LIVE_READ_RATE_LIMIT_PER_IP:-0}
      XCPRO_LIVE_READ_RATE_LIMIT_PER_SESSION: ${XCPRO_LIVE_READ_RATE_LIMIT_PER_SESSION:-0}
    volumes:
      - type: bind
        source: /opt/xcpro/secrets/google-play-service-account.json
        target: /run/secrets/google-play-service-account.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/xcpro/secrets/fcm-service-account.json
        target: /run/secrets/fcm-service-account.json
        read_only: true
        bind:
          create_host_path: false

  db:
    image: postgres:15
    container_name: xcpro-db
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: xcpro-redis
    restart: always

volumes:
  pgdata:
